name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        name: "HACS Validation"
        with:
          category: integration
      - uses: home-assistant/actions/hassfest@master
        name: "HA Validation"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: write
    # Releases are made by hand in the fork
    if: github.repository == 'SplinterHead/ha-honeygain' && github.ref == 'refs/heads/main' && success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: python-semantic-release/python-semantic-release@v9.8.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
