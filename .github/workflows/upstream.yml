# Every Monday at 05:00 UTC: merge new commits from SplinterHead/ha-honeygain,
# run the tests, open a pull request if they pass, an issue if the merge or the
# tests fail. Releases stay manual.
name: Upstream
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/SplinterHead/ha-honeygain.git
          git fetch upstream main
          if [ -z "$(git log --oneline HEAD..upstream/main)" ]; then echo "result=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          git log --oneline HEAD..upstream/main > "$RUNNER_TEMP/commits.txt"
          git switch -C upstream-update
          if git merge upstream/main --no-edit; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.merge.outputs.result == 'merged'
        with:
          python-version: '3.13'
      - name: Test
        if: steps.merge.outputs.result == 'merged'
        run: |
          pip install pytest-homeassistant-custom-component "$(jq -r '.requirements[]' custom_components/honeygain/manifest.json)"
          python -m pytest -q
      - name: Open pull request
        if: steps.merge.outputs.result == 'merged' && success()
        run: |
          git push -f origin upstream-update
          gh pr view upstream-update --json state -q .state 2>/dev/null | grep -q OPEN \
            || gh pr create --head upstream-update --title 'Novità da SplinterHead/ha-honeygain' \
              --body "Prove superate. Novità:"$'\n\n'"$(cat "$RUNNER_TEMP/commits.txt")"
      - name: Report problem
        if: failure() || steps.merge.outputs.result == 'conflict'
        run: |
          reason=$([ '${{ steps.merge.outputs.result }}' = conflict ] && echo 'si scontrano con le nostre modifiche' || echo 'fanno fallire le prove')
          title='Novità da SplinterHead/ha-honeygain da unire a mano'
          body="Le novità dell'originale $reason: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n'"$(cat "$RUNNER_TEMP/commits.txt" 2>/dev/null)"
          echo "### $title"$'\n\n'"$body" >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number' 2>/dev/null || true)"
          [ -n "$existing" ] || gh issue create --title "$title" --body "$body" || true
          if [ '${{ steps.merge.outputs.result }}' = conflict ]; then exit 1; fi
