# Fork only: runs the tests on every push, Validate only checks HACS and hassfest
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          pip install pytest-homeassistant-custom-component "$(jq -r '.requirements[]' custom_components/honeygain/manifest.json)"
          python -m pytest -q
